name: Uygulamayı Derle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'takip/**'
      - '.github/workflows/takip.yml'
      - '**.md'

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android proje dosyalarını oluştur
        run: |
          flutter create --org com.catwebtasarim --project-name erbakanmtal --platforms android .
          python3 ci/android_ayarla.py

      - name: Paketler ve uygulama simgesi
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "İmza anahtarı bulundu."
          else
            echo "::warning::KEYSTORE_BASE64 yok. Uygulama test anahtarıyla imzalanacak (telefona kurulur ama Play Store'a yüklenemez)."
          fi

      - name: Derle (APK + AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "::warning::Firebase bilgileri yok. Uygulama çalışır ama bildirim almaz."
          fi
          AYARLAR=(
            --release
            --build-number=${{ github.run_number }}
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID"
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          )
          flutter build apk "${AYARLAR[@]}"
          flutter build appbundle "${AYARLAR[@]}"
          mkdir -p cikti
          cp build/app/outputs/flutter-apk/app-release.apk cikti/erbakanmtal-telefona-kur.apk
          cp build/app/outputs/bundle/release/app-release.aab cikti/erbakanmtal-play-store.aab

      - uses: actions/upload-artifact@v4
        with:
          name: erbakanmtal-uygulama-${{ github.run_number }}
          path: cikti/
