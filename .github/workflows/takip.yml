name: Yeni İçerik Takibi

on:
  schedule:
    - cron: '*/15 * * * *'   # her 15 dakikada bir (GitHub bazen birkaç dakika geciktirir)
  workflow_dispatch:
    inputs:
      deneme:
        description: 'Sadece deneme bildirimi gönder'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: takip
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests beautifulsoup4 google-auth

      - name: Siteyi kontrol et
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DENEME_BILDIRIMI: ${{ inputs.deneme && '1' || '0' }}
        run: python takip/takip.py

      - name: Görülen içerikleri kaydet
        run: |
          if [ -n "$(git status --porcelain takip/)" ]; then
            git config user.name "takip-botu"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add takip/gorulen.json
            git commit -m "Yeni içerikler kaydedildi"
            git push
          fi
